name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: ghostprompt --list-rules

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean file passes (via this repo's own action)
        uses: ./
        with:
          path: examples/clean.md
      - name: Poisoned examples are caught
        run: |
          if ghostprompt examples --no-color; then
            echo "::error::GhostPrompt missed the poisoned examples"; exit 1
          fi
